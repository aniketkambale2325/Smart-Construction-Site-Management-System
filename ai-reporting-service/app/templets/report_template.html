<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <style>
  body { font-family: Helvetica, sans-serif; margin: 40px; color: #222; }
  h1 { color: #0f6e56; border-bottom: 2px solid #0f6e56; padding-bottom: 8px; }
  .meta { color: #666; font-size: 13px; margin-bottom: 20px; }
  .section { margin-top: 20px; }
  .label { font-weight: bold; color: #0f6e56; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  td, th { border: 1px solid #ddd; padding: 8px; font-size: 13px; text-align: left; }
  .progress-bar { background: #eee; border-radius: 6px; height: 18px; width: 100%; }
  .progress-fill { background: #0f6e56; height: 18px; border-radius: 6px; }
</style>
</head>
<body>
        <h1>{{ report_type | capitalize }} Site Repost</h1>
        <div class="meta"> Site: {{site_name}} &nbsp; | &nbsp; Date: {{ report_date }}</div>

        <div class="section">
            <span class="label"> Progress:</span> {{ percent_complete }}%
            <div class="progress-bar"> <div class="progress-fill" style="width:{{ percent_complete }}%;"> </div> </div>
        </div>

        <div class="section">
            <span> Description : </span>
            <p> {{ description }} </p>
        </div>
         <div class="section">
            <span class="label">Submitted By:</span> {{ submitted_by }}

         </div>

</body>
</html>
